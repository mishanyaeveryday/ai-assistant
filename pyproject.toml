    "bcrypt>=4.0",
    "docker>=7.0",
    "google-generativeai>=0.8.6",
    "langchain>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-groq>=0.3",
    "langchain-mcp-adapters>=0.1.7",
    "mcp[cli]>=1.21.2",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic>=2.0",
    "pyside6>=6.9",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.0",
    "qasync>=0.28",
    "tavily-python>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.0",
]
